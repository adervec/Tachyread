<svg viewBox="0 0 360 360" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Tachyread</title>
<desc>A wide-eyed cosmic goose in a starry roundel, halo above its head, beak open while a robotic claw pours a funnel of books and letters into it.</desc>
<defs>
<clipPath id="tr-badge"><circle cx="180" cy="180" r="168"/></clipPath>
<!-- Depth: every solid is lit from the upper left, so the badge reads as a sphere-lit scene
     rather than flat vector shapes. -->
<radialGradient id="tr-sky" cx="34%" cy="26%" r="86%">
  <stop offset="0%" stop-color="#2a1e63"/><stop offset="55%" stop-color="#191140"/><stop offset="100%" stop-color="#0c0824"/>
</radialGradient>
<radialGradient id="tr-body" cx="34%" cy="28%" r="78%">
  <stop offset="0%" stop-color="#fffdf6"/><stop offset="52%" stop-color="#f6f0de"/>
  <stop offset="86%" stop-color="#ddd2b4"/><stop offset="100%" stop-color="#c6b892"/>
</radialGradient>
<radialGradient id="tr-head" cx="34%" cy="26%" r="80%">
  <stop offset="0%" stop-color="#fffefa"/><stop offset="58%" stop-color="#f5efdd"/>
  <stop offset="100%" stop-color="#d3c7a6"/>
</radialGradient>
<linearGradient id="tr-neck" x1="0" y1="1" x2="0.6" y2="0">
  <stop offset="0%" stop-color="#e6dcc0"/><stop offset="45%" stop-color="#f5efdd"/><stop offset="100%" stop-color="#fffdf6"/>
</linearGradient>
<linearGradient id="tr-wing" x1="0.1" y1="0" x2="0.8" y2="1">
  <stop offset="0%" stop-color="#efe7d2"/><stop offset="100%" stop-color="#cdbf9c"/>
</linearGradient>
<linearGradient id="tr-beak-top" x1="0" y1="0" x2="0.3" y2="1">
  <stop offset="0%" stop-color="#fcd34d"/><stop offset="55%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#c2710a"/>
</linearGradient>
<linearGradient id="tr-beak-low" x1="0" y1="0" x2="0.2" y2="1">
  <stop offset="0%" stop-color="#e08c07"/><stop offset="100%" stop-color="#a85d05"/>
</linearGradient>
<linearGradient id="tr-steel" x1="0" y1="0" x2="1" y2="0.9">
  <stop offset="0%" stop-color="#f1f5f9"/><stop offset="38%" stop-color="#cbd5e1"/>
  <stop offset="70%" stop-color="#8fa0b4"/><stop offset="100%" stop-color="#5b6b80"/>
</linearGradient>
<linearGradient id="tr-arm" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#e2e8f0"/><stop offset="55%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#64748b"/>
</linearGradient>
<radialGradient id="tr-halo" cx="50%" cy="50%" r="50%">
  <stop offset="0%" stop-color="#fde68a" stop-opacity="0"/><stop offset="70%" stop-color="#fde68a" stop-opacity="0.35"/>
  <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.05"/>
</radialGradient>
<linearGradient id="tr-ring" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#fef3c7"/><stop offset="50%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#fcd34d"/>
</linearGradient>
<radialGradient id="tr-eye" cx="36%" cy="30%" r="72%">
  <stop offset="0%" stop-color="#ffffff"/><stop offset="72%" stop-color="#f3f4f6"/><stop offset="100%" stop-color="#cbd2da"/>
</radialGradient>
<radialGradient id="tr-glow" cx="50%" cy="50%" r="50%">
  <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.55"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
</radialGradient>
<filter id="tr-soft" x="-30%" y="-30%" width="160%" height="160%">
  <feDropShadow dx="3" dy="7" stdDeviation="7" flood-color="#0a0620" flood-opacity="0.45"/>
</filter>
<filter id="tr-lift" x="-40%" y="-40%" width="180%" height="180%">
  <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#0a0620" flood-opacity="0.4"/>
</filter>
</defs>

<circle cx="180" cy="180" r="168" fill="url(#tr-sky)"/>
<g clip-path="url(#tr-badge)">
  <ellipse cx="118" cy="120" rx="132" ry="104" fill="#6d28d9" opacity="0.32"/>
  <ellipse cx="252" cy="158" rx="124" ry="112" fill="#1d4ed8" opacity="0.28"/>
  <ellipse cx="196" cy="278" rx="146" ry="92" fill="#9d174d" opacity="0.22"/>
  <!-- Inner vignette: darkens the rim so the scene sits INSIDE a dome. -->
  <circle cx="180" cy="180" r="168" fill="none" stroke="#08061c" stroke-width="52" opacity="0.62"/>
  <ellipse cx="168" cy="242" rx="142" ry="40" fill="none" stroke="#a855f7" stroke-width="4" opacity="0.38" transform="rotate(-16 168 242)"/>
  <g fill="#ffffff">
    <circle cx="86" cy="96" r="2.2" opacity="0.95"/><circle cx="126" cy="64" r="1.4" opacity="0.8"/>
    <circle cx="58" cy="150" r="1.8" opacity="0.85"/><circle cx="74" cy="120" r="1.1" opacity="0.7"/>
    <circle cx="102" cy="196" r="1.5" opacity="0.8"/><circle cx="58" cy="210" r="1.3" opacity="0.75"/>
    <circle cx="150" cy="48" r="1.6" opacity="0.9"/><circle cx="44" cy="176" r="1.2" opacity="0.7"/>
    <circle cx="96" cy="252" r="1.4" opacity="0.8"/><circle cx="150" cy="302" r="1.5" opacity="0.85"/>
    <circle cx="286" cy="262" r="1.6" opacity="0.8"/><circle cx="308" cy="196" r="1.4" opacity="0.75"/>
    <circle cx="252" cy="306" r="1.4" opacity="0.8"/><circle cx="206" cy="306" r="1.2" opacity="0.7"/>
    <circle cx="118" cy="276" r="1.2" opacity="0.7"/>
  </g>
  <circle cx="120" cy="150" r="1.7" fill="#fde68a" opacity="0.9"/>
  <circle cx="60" cy="250" r="1.5" fill="#a5f3fc" opacity="0.85"/>
  <circle cx="322" cy="158" r="1.4" fill="#fde68a" opacity="0.8"/>
  <path d="M66 129 L68.7 135.3 L75 138 L68.7 140.7 L66 147 L63.3 140.7 L57 138 L63.3 135.3 Z" fill="#fde68a" opacity="0.9"/>
  <path d="M300 250 L302.4 255.6 L308 258 L302.4 260.4 L300 266 L297.6 260.4 L292 258 L297.6 255.6 Z" fill="#fde68a" opacity="0.85"/>
  <path d="M146 300 L148.1 304.9 L153 307 L148.1 309.1 L146 314 L143.9 309.1 L139 307 L143.9 304.9 Z" fill="#a5f3fc" opacity="0.8"/>
  <!-- Contact shadow under the bird, so it sits in the scene instead of floating on it. -->
  <ellipse cx="166" cy="292" rx="92" ry="17" fill="#08061c" opacity="0.4"/>
</g>

<!-- Goose: tail, body, wing — all lit from the upper left. No stomach contents; the gavage is
     implied by the funnel above, which reads far better than showing what's inside the bird. -->
<g filter="url(#tr-soft)">
  <path d="M92 212 L62 200 L92 188 Z" fill="#ded3b6"/>
  <ellipse cx="160" cy="232" rx="80" ry="62" fill="url(#tr-body)"/>
</g>
<!-- Folded wing: a leaf shape with layered feather lines and a lit leading edge, so it reads as a
     wing lying on the body rather than a flat patch of colour. -->
<path d="M128 238 q48 -26 92 4 q-16 30 -46 42 q-32 12 -44 -8 q-8 -16 -2 -38 z" fill="url(#tr-wing)" opacity="0.96"/>
<path d="M130 236 q46 -24 88 6" fill="none" stroke="#fffdf6" stroke-width="2.8" opacity="0.7" stroke-linecap="round"/>
<g fill="none" stroke="#a8966d" stroke-linecap="round" opacity="0.5">
  <path d="M142 252 q34 -9 62 4" stroke-width="2"/>
  <path d="M140 264 q32 -8 54 6" stroke-width="1.8"/>
  <path d="M142 275 q26 -6 42 4" stroke-width="1.5"/>
</g>
<!-- Body rim light along the top-left edge -->
<path d="M100 214 a80 62 0 0 1 58 -44" fill="none" stroke="#fffdf6" stroke-width="3.4" opacity="0.65" stroke-linecap="round"/>

<path d="M172 210 Q198 128 218 110" fill="none" stroke="url(#tr-neck)" stroke-width="40" stroke-linecap="round"/>
<path d="M166 208 Q192 130 212 112" fill="none" stroke="#fffdf6" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
<g filter="url(#tr-lift)">
  <circle cx="220" cy="104" r="32" fill="url(#tr-head)"/>
</g>
<path d="M198 92 a32 32 0 0 1 20 -19" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.55" stroke-linecap="round"/>

<!-- Halo: a lit ring with its own glow, tilted in perspective -->
<ellipse cx="216" cy="62" rx="44" ry="13" fill="url(#tr-halo)"/>
<ellipse cx="216" cy="62" rx="35" ry="9" fill="none" stroke="url(#tr-ring)" stroke-width="4.5" opacity="0.95"/>
<ellipse cx="216" cy="59.5" rx="35" ry="9" fill="none" stroke="#fffbeb" stroke-width="1.6" opacity="0.65"/>

<circle cx="231" cy="95" r="12.5" fill="url(#tr-eye)"/>
<circle cx="235" cy="98" r="6.4" fill="#241a3f"/>
<circle cx="237.4" cy="95.2" r="2.1" fill="#ffffff"/>
<circle cx="232.2" cy="100.6" r="1.1" fill="#ffffff" opacity="0.7"/>
<path d="M219 79 q13 -6 26 1" fill="none" stroke="#b9a87f" stroke-width="3.2" stroke-linecap="round"/>

<path d="M244 92 L292 72 L250 100 Z" fill="url(#tr-beak-top)"/>
<path d="M247 116 L292 118 L250 122 Z" fill="url(#tr-beak-low)"/>
<path d="M245 93 L288 74" fill="none" stroke="#fef3c7" stroke-width="1.8" opacity="0.75" stroke-linecap="round"/>

<path d="M278 100 Q274 116 262 124 Q272 112 272 98 Z" fill="#fbbf24" opacity="0.9"/>
<circle cx="268" cy="118" r="2.4" fill="#fde68a"/><circle cx="276" cy="110" r="1.8" fill="#fde68a"/>

<!-- Robotic funnel + arm: brushed-steel gradients with a specular edge -->
<g filter="url(#tr-lift)">
  <path d="M252 40 L304 40 L284 86 L284 100 L272 100 L272 86 Z" fill="url(#tr-steel)"/>
</g>
<path d="M254 42 L272 42 L276 52 L275 88 L273 88 L273 85 Z" fill="#ffffff" opacity="0.35"/>
<path d="M288 40 L304 40 L284 86 L284 100 L280 100 L280 86 Z" fill="#41506380" />
<path d="M278 58 l8 5 0 10 -8 5 -8 -5 0 -10 z" fill="#22d3ee" opacity="0.9"/>
<circle cx="278" cy="68" r="2.2" fill="#155e75"/>
<rect x="276" y="6" width="18" height="40" rx="9" fill="url(#tr-arm)" transform="rotate(28 285 26)"/>
<path d="M256 42 q-9 -7 -3 -16" fill="none" stroke="#7d8ea3" stroke-width="6" stroke-linecap="round"/>
<path d="M300 42 q9 -7 3 -16" fill="none" stroke="#7d8ea3" stroke-width="6" stroke-linecap="round"/>
<circle cx="285" cy="26" r="10" fill="url(#tr-glow)"/>
<circle cx="285" cy="26" r="4.5" fill="#67e8f9"/>
<circle cx="283.6" cy="24.4" r="1.6" fill="#ffffff" opacity="0.9"/>

<g stroke="#fde68a" stroke-linecap="round" opacity="0.5">
  <line x1="262" y1="16" x2="268" y2="38" stroke-width="2"/>
  <line x1="288" y1="14" x2="292" y2="36" stroke-width="2"/>
  <line x1="300" y1="20" x2="302" y2="38" stroke-width="1.6"/>
</g>
<!-- Books tumbling down the funnel: spine + cover + page edge = a little volume each -->
<g transform="rotate(-18 270 28)" filter="url(#tr-lift)">
  <rect x="258" y="18" width="24" height="17" rx="2.5" fill="#2dd4bf"/>
  <rect x="258" y="18" width="7" height="17" rx="1" fill="#0d9488"/>
  <rect x="265" y="18" width="17" height="3.4" fill="#ffffff" opacity="0.5"/>
</g>
<g transform="rotate(16 300 16)" filter="url(#tr-lift)">
  <rect x="288" y="6" width="24" height="17" rx="2.5" fill="#fb7185"/>
  <rect x="288" y="6" width="7" height="17" rx="1" fill="#e11d48"/>
  <rect x="295" y="6" width="17" height="3.4" fill="#ffffff" opacity="0.5"/>
</g>
<g transform="rotate(-8 284 40)" filter="url(#tr-lift)">
  <rect x="272" y="30" width="24" height="17" rx="2.5" fill="#fbbf24"/>
  <rect x="272" y="30" width="7" height="17" rx="1" fill="#d97706"/>
  <rect x="279" y="30" width="17" height="3.4" fill="#ffffff" opacity="0.5"/>
</g>

<circle cx="180" cy="180" r="167" fill="none" stroke="url(#tr-ring)" stroke-width="4.5" opacity="0.95"/>
<circle cx="180" cy="180" r="160" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.42"/>
</svg>
